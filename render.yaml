services:
  - type: web
    name: design-center
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    envVars:
      # Web3Forms access key for the "Send my selections" button. Set the value in
      # the Render dashboard (sync: false = not stored in the repo). Vite inlines it
      # at build time; until set, the app falls back to mailto. See .env.example.
      - key: VITE_WEB3FORMS_KEY
        sync: false
    routes:
      # SPA fallback — every path serves the built index.html.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Theme/OG imagery is content-stable; cache for a day, revalidate after.
      - path: /theme-images/*
        name: Cache-Control
        value: public, max-age=86400, stale-while-revalidate=604800
      # The SPA shell must revalidate quickly so deploys reach clients fast.
      - path: /index.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
