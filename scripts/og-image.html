<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    background: #0b0b0f; color: #f5f5f4;
    font-family: 'Space Grotesk', system-ui, sans-serif;
    display: flex; flex-direction: column; justify-content: center; padding: 0 96px;
  }
  /* film-grain noise, same recipe as the app shell */
  body::after {
    content: ''; position: absolute; inset: 0; opacity: 0.05; pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }
  .glow { position: absolute; right: -140px; top: -160px; width: 520px; height: 520px;
    border-radius: 50%; background: rgba(201,184,255,0.16); filter: blur(110px); }
  .badge { display: inline-flex; align-items: center; gap: 10px; font-size: 22px;
    letter-spacing: 0.22em; text-transform: uppercase; color: #9a9aa6; margin-bottom: 28px;
    font-family: 'Instrument Sans', system-ui, sans-serif; font-weight: 500; }
  .badge .dot { width: 12px; height: 12px; border-radius: 50%; background: #c9b8ff; }
  h1 { font-size: 88px; line-height: 1.0; letter-spacing: -0.02em; font-weight: 600; max-width: 980px; margin-top: -40px; }
  h1 .accent { color: #c9b8ff; }
  p { margin-top: 30px; font-size: 30px; color: #9a9aa6; max-width: 860px; line-height: 1.4;
    font-family: 'Instrument Sans', system-ui, sans-serif; }
  .swatches { position: absolute; right: 96px; bottom: 72px; display: flex; gap: 14px; }
  .swatches span { width: 54px; height: 54px; border-radius: 16px; box-shadow: 0 0 0 1px rgba(255,255,255,0.12); }
  .footer { position: absolute; left: 96px; bottom: 72px; font-size: 24px; color: #9a9aa6;
    font-family: 'Instrument Sans', system-ui, sans-serif; }
  .footer b { color: #f5f5f4; font-weight: 600; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="badge"><span class="dot"></span> Design Center</div>
  <h1>Stop describing your dream website. <span class="accent">Point at it.</span></h1>
  <p>46 live themes · 50 palettes · 43 type pairings — previewed live.</p>
  <div class="footer"><b>Tech SLP Studio</b> · thetechslp.com</div>
  <div class="swatches">
    <span style="background:#2B6CB0"></span>
    <span style="background:#4FD1C5"></span>
    <span style="background:#c9b8ff"></span>
    <span style="background:#F6AD55"></span>
    <span style="background:#FB7185"></span>
  </div>
</body>
</html>
