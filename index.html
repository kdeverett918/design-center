<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0f" />
    <meta
      name="description"
      content="Tech SLP Studio Design Center. Build a live design mood board, tune palettes and typography, shortlist ideas, and send a polished creative brief."
    />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Design Center · Tech SLP Studio" />
    <meta
      property="og:description"
      content="Build a live design mood board, tune palettes and typography, shortlist ideas, and send a polished creative brief."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Studio brand chrome fonts (the gallery shell, not the library content) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Design Center · Tech SLP Studio</title>

    <!-- Apply saved light/dark shell mode before paint (no flash). -->
    <script>
      (function () {
        try {
          var m = localStorage.getItem('dc:mode');
          document.documentElement.dataset.mode = m === 'light' || m === 'dark' ? m : 'dark';
        } catch (e) {
          document.documentElement.dataset.mode = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
